[workspace]
resolver = "3"
members = ["crates/glotcap", "crates/glotcap-server"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
base64 = "0.22"
[workspace.lints.rust]
unsafe_code = "forbid"
